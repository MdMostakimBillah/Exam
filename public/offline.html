<!doctype html>
<!-- Offline fallback served by /sw.js when a navigation has no network.
     Fully self-contained: inline styles only, no external fonts/JS, icons are
     precached by the service worker. Bilingual (EN + BN) to match the app. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090909" />
    <title>Offline — Bangladesh Madrasah Association</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: #090909;
        color: #e4e4e7;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", "Noto Sans Bengali", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      main {
        text-align: center;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      img { width: 88px; height: 88px; }
      h1 { font-size: 1.5rem; font-weight: 700; color: #fafafa; }
      h2 { font-size: 1.125rem; font-weight: 600; color: #a1a1aa; }
      p { font-size: 0.95rem; line-height: 1.6; color: #a1a1aa; }
      .card {
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 16px;
        padding: 24px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      button {
        background: #fafafa;
        color: #090909;
        border: 0;
        border-radius: 10px;
        padding: 12px 24px;
        font-size: 1rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }
      button:hover { opacity: 0.88; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <img src="/icons/icon-192.png" alt="" width="88" height="88" />
        <div>
          <h1>You&rsquo;re offline</h1>
          <h2 lang="bn">আপনাইন্টারনেট সংযোগ নেই</h2>
        </div>
        <p>
          Please check your internet connection and try again. Your work has not
          been submitted.
        </p>
        <p lang="bn">
          অনুগ্রহ করে আপনার ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন। আপনার কোনো
          কাজ জমা হয়নি।
        </p>
        <button type="button" onclick="location.reload()">
          Try again / আবার চেষ্টা করুন
        </button>
      </div>
    </main>
    <script>
      // Reload automatically the moment connectivity returns.
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
